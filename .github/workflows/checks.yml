name: Simulation checks

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python simulate.py --out ci_results
      - name: Check the beginner-friendly star lab
        run: node checks/star_lab.cjs
      - name: Check completed-run notes and comparisons
        run: node checks/notebook.cjs
      - name: Check arm geometry, servos and experiment comparisons
        run: node checks/arm.cjs
      - name: Independently verify sampled arm dynamics
        run: python verify_arm.py
      - name: Check reproducible arm benchmark files
        run: node checks/arm_benchmark.cjs
